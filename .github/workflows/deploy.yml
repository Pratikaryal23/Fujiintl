name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build project
        run: |
          echo "📦 Building project..."
          npm ci || npm install
          npm run build

          if [ ! -d "./dist" ]; then
            echo "❌ ./dist directory not found! Build may have failed."
            exit 1
          fi

          if [ -z "$(ls -A ./dist)" ]; then
            echo "❌ ./dist directory is empty! Build may have failed."
            exit 1
          fi

          echo "✅ Build completed and dist is ready"

      - name: Clean old build files on server (preserve .htaccess)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            TARGET="~/fujiintl.com"
            echo "🧹 Cleaning old build files on $TARGET (preserving .htaccess)..."
            cd $TARGET && find . -mindepth 1 -maxdepth 1 ! -name '.htaccess' -delete 2>/dev/null || true
            echo "✅ Cleanup completed"

      - name: Upload new build files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "dist/**"
          target: "~/fujiintl.com"
          strip_components: 1

      - name: Verify upload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🔍 Verifying upload..."
            ls -la ~/fujiintl.com
            echo "✅ Deployment complete!"
            echo "🌐 Your site should be available at: https://fujiintl.com"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to production completed successfully"
            echo "Repository: ${{ github.repository }}"
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Triggered by: ${{ github.actor }}"
          else
            echo "❌ Deployment to production failed"
            echo "Please check the logs above for details"
          fi
